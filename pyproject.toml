[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envdoctor"
version = "0.1.0"
description = "Diagnose why any repository won't run on your machine — then step into a clean, disposable environment where it just works."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "The EnvDoctor Authors" }]
requires-python = ">=3.10"
keywords = ["developer-tools", "docker", "environment", "cli", "onboarding", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "platformdirs>=3.0",
    "python-dotenv>=1.0",
    "docker>=7.0",
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-docker",
]

[project.urls]
Homepage = "https://github.com/envdoctor/envdoctor"
Documentation = "https://github.com/envdoctor/envdoctor/blob/main/DESIGN.md"
Changelog = "https://github.com/envdoctor/envdoctor/blob/main/CHANGELOG.md"

[project.scripts]
envdoctor = "envdoctor.cli.main:run"
tempenv = "envdoctor.cli.main:run_tempenv"

[tool.hatch.build.targets.wheel]
packages = ["src/envdoctor"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["envdoctor"]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires call expressions as parameter defaults (B008 by design).
"src/envdoctor/cli/*" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["envdoctor"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "docker: tests that require a real container runtime (skipped when none is available)",
]
